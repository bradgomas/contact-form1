<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>contact-form.html</title>
    <link rel="stylesheet" href="contact-form.css">
</head>

<body>
    <main>
        <h2>Contact Form</h2>
        <p>Please fill all the texts in the fields.</p>

        <form>
            <label>Your Name: <input type="text" placeholder="Your Full Name" required></label>
            <label>Your Email: <input type="email" placeholder="Valid Email Address" required></label>
            <label>Message: <textarea placeholder="Your Message to Us"></textarea></label>
            <label>Subject:
                <select>
                    <option>Job Inquiry</option>
                    <option>General Support</option>
                </select>
            </label>
            <input type="submit" value="Send">
        </form>
    </main>
</body>

</html>
